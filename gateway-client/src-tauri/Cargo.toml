[package]
name = "ai-llm-client"
version = "1.0.0"
description = "AI-LLM 桌面客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "ai_llm_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
